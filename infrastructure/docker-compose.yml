services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: cricket-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-worker:
    profiles: ["notifications"]
    build:
      context: ../services/match-service
      dockerfile: Dockerfile.notifications
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: ${NOTIFICATIONS_MONGODB_URI:-}
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

volumes:
  kafka_data:
