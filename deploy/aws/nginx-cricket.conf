# cricket-scoring-mern — nginx site config
# Serves the Vite production build and proxies API paths to the local services.
# Installed by setup-ec2.sh to /etc/nginx/conf.d/cricket.conf (default.conf removed).
# Certbot --nginx will rewrite this file when you add HTTPS (guide step 7).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ec2-user/cricket/frontend/dist;
    index index.html;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # --- API reverse proxies (paths are passed through unchanged) -------------
    location /api/v1/auth {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/players {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/teams {
        proxy_pass http://127.0.0.1:4004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # When match-service / scoring-service are deployed, add the same block:
    # location /api/v1/matches { proxy_pass http://127.0.0.1:4003; ... }

    # --- Hashed static assets -------------------------------------------------
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
